[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cppp-collector"
version = "0.1.0"
description = "Central Public Procurement Portal (CPPP) tender collector for India"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Lakshay Chauhan", email = "lakshay@9th.fun"}
]
keywords = ["cppp", "procurement", "india", "tenders", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]

[project.scripts]
cppp-collect = "cppp_collector.cli:main"

[project.urls]
Homepage = "https://github.com/pardarsh/cppp-collector"
Repository = "https://github.com/pardarsh/cppp-collector"
Issues = "https://github.com/pardarsh/cppp-collector/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cppp_collector*"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
